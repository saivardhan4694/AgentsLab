name: gh
binary: gh
description: GitHub CLI (uses the account gh is logged in to)
tools:
  - name: pr_list
    description: List open pull requests of a GitHub repository
    risk: low
    args:
      repo:  { type: string, pattern: "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", description: owner/name }
      limit: { type: integer, default: 20, min: 1, max: 100 }
    argv: ["pr", "list", "--repo", "{repo}", "--limit", "{limit}"]
  - name: issue_list
    description: List open issues of a GitHub repository
    risk: low
    args:
      repo:  { type: string, pattern: "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", description: owner/name }
      limit: { type: integer, default: 20, min: 1, max: 100 }
    argv: ["issue", "list", "--repo", "{repo}", "--limit", "{limit}"]
